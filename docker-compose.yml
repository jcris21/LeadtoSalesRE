# Local development stack.
#
# Our own FastAPI app talks to the internal Postgres-based Outbox/Inbox event
# bus (no Redis — Architecture.md §5: "sin infraestructura de broker externa").
# Chatwoot, however, is a separate product with its OWN mandatory dependencies
# (its own Postgres + Redis for Sidekiq) — that is Chatwoot's architecture, not
# a choice made by this project, and is unavoidable to run Chatwoot locally.
#
# wacrm is mocked (mocks/wacrm_mock) until real wacrm credentials/instance are
# available; swap CRM_CONFIG.base_url to the real wacrm when you have it.

services:
  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - wacrm-mock
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

  wacrm-mock:
    build: ./mocks/wacrm_mock
    ports:
      - "8080:8080"

  # --- Chatwoot (SoR for conversations) and its own required dependencies ---
  chatwoot_postgres:
    image: pgvector/pgvector:pg15
    restart: always
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=chatwoot
      - POSTGRES_PASSWORD=chatwoot

  chatwoot_redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - chatwoot_redis_data:/data

  chatwoot_rails:
    image: chatwoot/chatwoot:latest
    restart: always
    depends_on:
      - chatwoot_postgres
      - chatwoot_redis
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE:-changemechangemechangemechangeme}
      - FRONTEND_URL=http://localhost:3000
      - DEFAULT_LOCALE=es
      - FORCE_SSL=false
      - ENABLE_ACCOUNT_SIGNUP=true
      - REDIS_URL=redis://chatwoot_redis:6379
      - POSTGRES_HOST=chatwoot_postgres
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_PASSWORD=chatwoot
      - POSTGRES_DATABASE=chatwoot
    command: >
      sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"

  chatwoot_sidekiq:
    image: chatwoot/chatwoot:latest
    restart: always
    depends_on:
      - chatwoot_postgres
      - chatwoot_redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE:-changemechangemechangemechangeme}
      - REDIS_URL=redis://chatwoot_redis:6379
      - POSTGRES_HOST=chatwoot_postgres
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_PASSWORD=chatwoot
      - POSTGRES_DATABASE=chatwoot
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  chatwoot_postgres_data:
  chatwoot_redis_data:
